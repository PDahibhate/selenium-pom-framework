name: 🧪 Selenium Automation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'   # Nightly regression at 2 AM UTC

jobs:
  test:
    name: Run Automation Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 🧩 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: 🚀 Run tests (headless Chrome)
        run: mvn clean test -Dheadless=true -Dbrowser=chrome

      - name: 📊 Upload ExtentReport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-report
          path: reports/ExtentReport.html

      - name: 📸 Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots
          path: reports/screenshots/
